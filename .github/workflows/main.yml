name: Todo CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-project:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the code from your repo into the cloud runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Check if the main files actually exist
      - name: Check for Files
        run: |
          ls -l
          test -f index.html || (echo "index.html is missing!" && exit 1)

      # 3. Try to build the Docker image
      - name: Build Docker Image
        run: docker build -t my-todo-app .

      # 4. Final verification
      - name: Pipeline Result
        run: echo "CI Pipeline passed successfully!"
